<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Consulta de documentos')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: nav-ciudadano('consulta')}"></nav>

    <main class="container my-5 d-flex justify-content-center">
        <div class="card shadow" style="max-width:680px; width:100%;">
            <div class="card-header border-bottom border-danger border-3">
                <h4 class="mb-0">Consultar documento por expediente</h4>
            </div>
            <div class="card-body p-4">
                <p class="mb-3">Escribe los siguientes datos para ver el seguimiento de tu documento:</p>
                <ul class="mb-4">
                    <li>Número de <strong class="text-danger">EXPEDIENTE</strong></li>
                    <li>Número del documento de identidad del remitente</li>
                </ul>
                <form th:action="@{/consulta}" method="get">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Número de expediente <span class="text-danger">*</span></label>
                            <input type="text" name="expediente" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI del remitente <span class="text-danger">*</span></label>
                            <input type="text" name="dni" class="form-control" maxlength="8" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light d-flex justify-content-end">
                <button class="btn btn-danger"><i class="fas fa-search"></i> Buscar</button>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
