<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis Reclamos')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: nav-ciudadano('mis')}"></nav>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
            <h2 class="fw-bold">Mis Reclamos</h2>
            <div class="d-flex gap-2">
                <input type="text" class="form-control" placeholder="Buscar...">
                <select class="form-select" style="width:auto;">
                    <option value="">Todos los estados</option>
                    <option>Pendiente</option>
                    <option>En proceso</option>
                    <option>Resuelto</option>
                </select>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>N° Expediente</th>
                            <th>Fecha</th>
                            <th>Asunto</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reclamos}">
                            <td><strong th:text="${r.codigoSeguimiento}">EXP-001</strong></td>
                            <td th:text="${#temporals.format(r.fechaRegistro, 'dd/MM/yyyy')}">15/01/2026</td>
                            <td th:text="${r.asunto}">Asunto</td>
                            <td th:text="${r.categoria.nombreCategoria}">RECLAMO</td>
                            <td>
                                <span class="badge"
                                    th:classappend="${r.estado.nombreEstado == 'Pendiente'} ? 'bg-warning text-dark' : (${r.estado.nombreEstado == 'Resuelto'} ? 'bg-success' : 'bg-info')"
                                    th:text="${r.estado.nombreEstado}">Pendiente</span>
                            </td>
                            <td>
                                <a th:href="@{/detalle/{id}(id=${r.idReclamo})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
