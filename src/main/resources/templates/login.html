<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>

<body class="bg-light" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">

    <div class="container" style="max-width:420px;">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4 text-center"
                style="background:linear-gradient(135deg,#C8102E,#9B0A20); color:white;">
                <img th:src="@{/assets/img/logo-muni.png}" alt="Logo"
                    style="height:80px; background:white; border-radius:50%; padding:10px;">
                <h4 class="mt-3 fw-bold">Mesa de Partes Virtual</h4>
                <small>Municipalidad Provincial de Arequipa</small>
            </div>
            <div class="card-body p-4">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-user text-danger"></i> Correo electrónico</label>
                        <input type="email" name="correo" class="form-control" placeholder="usuario@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-lock text-danger"></i> Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña"
                            required>
                    </div>
                    <div class="d-flex justify-content-between mb-3 small">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="recordar">
                            <label class="form-check-label" for="recordar">Recordarme</label>
                        </div>
                        <a href="#" class="text-danger">¿Olvidó su contraseña?</a>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>
            </div>
            <div class="card-footer text-center bg-white border-0 pb-3">
                <small>¿No tiene cuenta? <a th:href="@{/registro}" class="text-danger fw-bold">Regístrese
                        aquí</a></small>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
