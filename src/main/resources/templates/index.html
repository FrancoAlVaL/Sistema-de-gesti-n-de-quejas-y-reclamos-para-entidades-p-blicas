<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nuevo Reclamo')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: nav-ciudadano('nuevo')}"></nav>

    <main class="container my-4">
        <div class="row">
            <!-- Panel informativo -->
            <aside class="col-lg-4">
                <div class="card shadow-sm border-0 mb-3">
                    <div class="card-body">
                        <h6 class="fw-bold text-danger"><i class="fas fa-info-circle"></i> Información importante</h6>
                        <p class="small text-muted">La atención en Mesa de Partes Virtual está habilitada las 24 horas,
                            los 7 días de la semana.</p>
                        <p class="small text-muted">Los documentos ingresados fuera del horario de atención (lun-vie
                            08:00 a 15:30) se consideran presentados el siguiente día hábil.</p>
                    </div>
                </div>
            </aside>

            <!-- Formulario -->
            <section class="col-lg-8">
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                <form th:action="@{/reclamos/guardar}" th:object="${reclamoForm}" method="post"
                    enctype="multipart/form-data">
                    <!-- Datos del remitente -->
                    <div class="card shadow-sm mb-3">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0">Datos del remitente</h5>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label">Documento</label>
                                    <select th:field="*{tipoDocumentoRemitente}" class="form-select">
                                        <option value="DNI">DNI</option>
                                        <option value="CE">Carné de extranjería</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Número <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{numeroDocumento}" class="form-control"
                                        maxlength="30" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Nombres <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{nombre}" class="form-control" maxlength="100" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Apellidos <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{apellidos}" class="form-control" maxlength="150" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono <span class="text-danger">*</span></label>
                                    <input type="tel" th:field="*{celular}" class="form-control" maxlength="20" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo electrónico <span
                                            class="text-danger">*</span></label>
                                    <input type="email" th:field="*{correo}" class="form-control" maxlength="150" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Datos del reclamo -->
                    <div class="card shadow-sm mb-3">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0">Datos del reclamo</h5>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Tipo de documento <span
                                            class="text-danger">*</span></label>
                                    <select th:field="*{tipoDocumentoId}" class="form-select" required>
                                        <option value="" disabled selected>Selecciona</option>
                                        <option th:each="tipo : ${tipos}" th:value="${tipo.idTipoDocumento}"
                                            th:text="${tipo.nombreTipo}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Categoría <span class="text-danger">*</span></label>
                                    <select th:field="*{categoriaId}" class="form-select" required>
                                        <option value="" disabled selected>Selecciona</option>
                                        <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}"
                                            th:text="${cat.nombreCategoria}"></option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Número</label>
                                    <input type="text" th:field="*{numeroDoc}" class="form-control" placeholder="S/N">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Fecha <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{fechaDocumento}" class="form-control"
                                        data-no-future required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Asunto <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{asunto}" class="form-control" maxlength="200" required>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label">Descripción <span class="text-danger">*</span></label>
                                    <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Archivo PDF <span class="text-danger">*</span></label>
                                    <input type="file" th:field="*{archivoEvidencia}" class="form-control" accept=".pdf"
                                        required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Observaciones</label>
                                    <input type="text" th:field="*{observaciones}" class="form-control" maxlength="120">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-light d-flex justify-content-end">
                            <button type="submit" class="btn btn-danger"><i class="fas fa-paper-plane"></i> Presentar
                                reclamo</button>
                        </div>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
