<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Panel de Estadísticas')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: nav-admin('estadisticas')}"></nav>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
            <h2 class="fw-bold">Panel de Estadísticas</h2>
            <div class="d-flex gap-2">
                <select class="form-select" style="width:auto;">
                    <option>2026</option>
                    <option>2025</option>
                </select>
                <button type="button" class="btn btn-danger" data-export-table="#tablaEstadisticas">
                    <i class="fas fa-download"></i> Exportar
                </button>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-danger border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-danger text-white rounded p-3"><i class="fas fa-file-alt fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${totalReclamos}">1,245</div><small class="text-muted">Total
                                Reclamos</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-success border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-success text-white rounded p-3"><i class="fas fa-check-circle fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${resueltos}">987</div><small
                                class="text-muted">Resueltos</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-warning border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-warning text-white rounded p-3"><i class="fas fa-clock fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${pendientes}">156</div><small
                                class="text-muted">Pendientes</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-info border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-info text-white rounded p-3"><i class="fas fa-hourglass-half fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${promedio}">3.2</div><small class="text-muted">Días
                                promedio</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4" id="tablaEstadisticas">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body"><canvas id="chartMeses"></canvas></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body"><canvas id="chartTipos"></canvas></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body"><canvas id="chartEstados"></canvas></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body"><canvas id="chartAreas"></canvas></div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script th:inline="javascript">
        window.reclamosStats = {
            meses: /*[[${datosMeses}]]*/ {},
            tipos: /*[[${datosTipos}]]*/ {},
            estados: /*[[${datosEstados}]]*/ {},
            areas: /*[[${datosAreas}]]*/ {}
        };
    </script>
    <script th:src="@{/js/estadisticas.js}" defer></script>
</body>

</html>
