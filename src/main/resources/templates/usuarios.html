<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Gestión de Usuarios')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: nav-admin('usuarios')}"></nav>

    <main class="container my-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <a th:href="@{/estadisticas}" class="text-danger"><i class="fas fa-home"></i> Inicio</a>
            <span class="text-muted mx-2">/</span>
            <span class="text-muted">Gestión de Usuarios</span>
        </nav>

        <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
            <div>
                <h2 class="fw-bold mb-0">Gestión de Usuarios</h2>
                <small class="text-muted">Administre los usuarios del sistema</small>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-danger"><i class="fas fa-file-export"></i> Exportar</button>
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                    <i class="fas fa-user-plus"></i> Nuevo Usuario
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-danger border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-danger text-white rounded p-3"><i class="fas fa-users fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${totalUsuarios}">24</div><small
                                class="text-muted">Total</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-success border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-success text-white rounded p-3"><i class="fas fa-user-check fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${activos}">19</div><small
                                class="text-muted">Activos</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-secondary border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-secondary text-white rounded p-3"><i class="fas fa-user-slash fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${inactivos}">5</div><small
                                class="text-muted">Inactivos</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm border-start border-warning border-4">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-warning text-white rounded p-3"><i class="fas fa-user-clock fa-lg"></i></div>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${online}">3</div><small
                                class="text-muted">Conectados</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Buscar por nombre, correo o DNI...">
                    </div>
                    <div class="col-md-2"><select class="form-select">
                            <option value="">Todos los roles</option>
                            <option>Administrador</option>
                            <option>Operador</option>
                            <option>Revisor</option>
                            <option>Ciudadano</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select">
                            <option value="">Todos los estados</option>
                            <option>Activo</option>
                            <option>Inactivo</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select">
                            <option value="">Todas las áreas</option>
                            <option>Obras Públicas</option>
                            <option>Servicios Públicos</option>
                            <option>Administración</option>
                        </select></div>
                    <div class="col-md-2"><button class="btn btn-outline-secondary w-100"><i
                                class="fas fa-sync-alt"></i> Limpiar</button></div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Usuario</th>
                            <th>Documento</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Rol</th>
                            <th>Área</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u, iter : ${usuarios}">
                            <td th:text="${iter.index + 1}">1</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                                        style="width:40px;height:40px;"
                                        th:text="${#strings.substring(u.nombre,0,1) + #strings.substring(u.apellidos,0,1)}">
                                        CA</div>
                                    <div>
                                        <div class="fw-bold" th:text="${u.nombre + ' ' + u.apellidos}"></div><small
                                            class="text-muted" th:text="'DNI: ' + ${u.numeroDocumento}"></small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${u.numeroDocumento}"></td>
                            <td th:text="${u.correo}"></td>
                            <td th:text="${u.celular}"></td>
                            <td><span class="badge bg-primary" th:text="${u.rol.nombreRol}"></span></td>
                            <td th:text="${u.area.nombreArea}"></td>
                            <td><span class="badge" th:classappend="${u.estadoActivo} ? 'bg-success' : 'bg-danger'"
                                    th:text="${u.estadoActivo ? 'Activo' : 'Inactivo'}"></span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-sm btn-outline-warning"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="fas fa-user-plus"></i> Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/usuarios}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Tipo documento</label><select
                                    name="tipoDocumento" class="form-select">
                                    <option>DNI</option>
                                    <option>CE</option>
                                </select></div>
                            <div class="col-md-6"><label class="form-label">Número <span
                                        class="text-danger">*</span></label><input type="text" name="numeroDocumento"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Nombres <span
                                        class="text-danger">*</span></label><input type="text" name="nombre"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Apellidos <span
                                        class="text-danger">*</span></label><input type="text" name="apellidos"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Correo <span
                                        class="text-danger">*</span></label><input type="email" name="correo"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Teléfono <span
                                        class="text-danger">*</span></label><input type="tel" name="celular"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Rol <span
                                        class="text-danger">*</span></label><select name="rol" class="form-select"
                                    required>
                                    <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombreRol}">
                                    </option>
                                </select></div>
                            <div class="col-md-6"><label class="form-label">Área <span
                                        class="text-danger">*</span></label><select name="area" class="form-select"
                                    required>
                                    <option th:each="a : ${areas}" th:value="${a.idArea}" th:text="${a.nombreArea}">
                                    </option>
                                </select></div>
                            <div class="col-md-6"><label class="form-label">Contraseña <span
                                        class="text-danger">*</span></label><input type="password" name="password"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Confirmar <span
                                        class="text-danger">*</span></label><input type="password" class="form-control"
                                    required></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formUsuario" class="btn btn-danger"><i class="fas fa-save"></i>
                        Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
